name: Frontend CI/CD - GCP

on:
  push:
    branches: [ main, develop ] 
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'kodehaus-frontend' }}
  IMAGE_NAME: kodehaus-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
        working-directory: .

      # ✅ NUEVO: Definir variables por ambiente
      - name: Set Environment Variables
        id: env-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Configuring for PRODUCTION"
            echo "SERVICE_NAME=kodehaus-frontend-dotnet" >> $GITHUB_ENV
            echo "BACKEND_URL=${{ vars.BACKEND_URL_DOTNET }}" >> $GITHUB_ENV
            echo "ENV_LABEL=production" >> $GITHUB_ENV
            echo "MIN_INSTANCES=0" >> $GITHUB_ENV
            echo "MAX_INSTANCES=5" >> $GITHUB_ENV
          else
            echo "Configuring for QA/DEVELOP"
            echo "SERVICE_NAME=kodehaus-frontend-dotnet-qa" >> $GITHUB_ENV
            echo "BACKEND_URL=${{ vars.BACKEND_URL_DOTNET_QA }}" >> $GITHUB_ENV
            echo "ENV_LABEL=development" >> $GITHUB_ENV
            echo "MIN_INSTANCES=0" >> $GITHUB_ENV
            echo "MAX_INSTANCES=3" >> $GITHUB_ENV
          fi

      - name: Build & Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          
          echo "🔨 Building Angular frontend with BACKEND_URL: ${{ env.BACKEND_URL }}"
          
          docker build \
            --build-arg BACKEND_URL="${{ env.BACKEND_URL }}" \
            --tag "${IMAGE_URI}" \
            --tag "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest" \
            .
          
          echo "📦 Pushing image..."
          docker push "${IMAGE_URI}"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest"
          
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE_URI}" --format='value(image_summary.digest)')
          echo "IMAGE_URI_DIGEST=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}@${DIGEST}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        working-directory: .
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --image "${IMAGE_URI_DIGEST}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances ${{ env.MIN_INSTANCES }} \
            --max-instances ${{ env.MAX_INSTANCES }} \
            --timeout 10 \
            --concurrency 80 \
            --cpu-boost \
            --labels "app=kodehaus-frontend,env=${{ env.ENV_LABEL }},tier=frontend"

      - name: Verify deployment
        working-directory: .
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          
          echo "🌐 Service URL: ${SERVICE_URL}"
          
          sleep 10
          
          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passed!"
          else
            echo "⚠️ Health check returned HTTP ${HTTP_CODE}"
          fi
          
          # Verificar index.html
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Frontend is serving!"
          else
            echo "⚠️ Frontend returned HTTP ${HTTP_CODE}"
          fi

      - name: Display deployment info
        working-directory: .
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          
          echo ""
          echo "🎉 =================================="
          echo "   Frontend Deployed Successfully!"
          echo "   =================================="
          echo ""
          echo "🌐 Frontend URL: ${SERVICE_URL}"
          echo "🔗 Backend URL: ${{ env.BACKEND_URL }}"
          echo "📦 Image: ${IMAGE_URI_DIGEST}"
          echo ""

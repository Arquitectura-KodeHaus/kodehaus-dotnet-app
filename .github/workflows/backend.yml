name: Backend CI/CD - GCP

on:
  push:
    branches: [ main, develop ] # ✅ Agregamos develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'kodehaus-backend' }}
  IMAGE_NAME: kodehaus-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
        working-directory: .

      - name: Set Environment Variables
        id: env-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Configuring for PRODUCTION"
            echo "SERVICE_NAME=kodehaus-backend-service" >> $GITHUB_ENV
            echo "SQL_INSTANCE=${{ secrets.CLOUD_SQL_INSTANCE }}" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=DB_URL_DOTNET" >> $GITHUB_ENV
            echo "ASP_ENV=Production" >> $GITHUB_ENV
            echo "ENV_LABEL=production" >> $GITHUB_ENV
          else
            echo "Configuring for QA/DEVELOP"
            echo "SERVICE_NAME=kodehaus-backend-service-qa" >> $GITHUB_ENV
            echo "SQL_INSTANCE=kodehaus-prod-474304:us-central1:pg-pruebas" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=DB_URL_DOTNET_QA" >> $GITHUB_ENV
            echo "ASP_ENV=Development" >> $GITHUB_ENV
            echo "ENV_LABEL=development" >> $GITHUB_ENV
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: Build & Push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          
          echo "🔨 Building .NET backend image..."
          docker build -t "$IMAGE_URI" .
          
          echo "📦 Pushing image..."
          docker push "$IMAGE_URI"
          
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE_URI" --format='value(image_summary.digest)')
          echo "IMAGE_URI_DIGEST=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}@${DIGEST}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        working-directory: .
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --image "${IMAGE_URI_DIGEST}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars "ASPNETCORE_ENVIRONMENT=${{ env.ASP_ENV }},ASPNETCORE_URLS=http://+:8080" \
            --set-cloudsql-instances "${{ env.SQL_INSTANCE }}" \
            --set-secrets "ConnectionStrings__DefaultConnection=${{ env.DB_SECRET_NAME }}:latest" \
            --labels "app=kodehaus-backend,env=${{ env.ENV_LABEL }},tier=backend"

      - name: Verify deployment
        working-directory: .
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          
          echo "🌐 Service URL: ${SERVICE_URL}"
          
          # Esperar que esté listo
          sleep 15
          
          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/api")
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 401 ]; then
            echo "✅ API health check passed (Status: $HTTP_CODE)!"
          else
            echo "⚠️  API returned HTTP ${HTTP_CODE}"
            echo "Trying to get response body..."
            curl -s "${SERVICE_URL}/api" || true
          fi

      - name: Display deployment info
        working-directory: .
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          
          echo ""
          echo "🎉 =================================="
          echo "   Backend Deployed Successfully!"
          echo "   =================================="
          echo ""
          echo "🌐 Backend URL: ${SERVICE_URL}"
          echo "📦 Image: ${IMAGE_URI_DIGEST}"
          echo "🔗 API Endpoint: ${SERVICE_URL}/api"
          echo "🔗 Swagger: ${SERVICE_URL}/swagger"
          echo ""